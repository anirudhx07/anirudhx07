<svg width="854" height="280" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(280px); }
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Roboto, sans-serif;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: -1px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #22d3ee;
      letter-spacing: 1px;
    }
    .desc {
      font-family: 'JetBrains Mono', Consolas, Monaco, -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .cursor {
      animation: pulse 1s infinite ease-in-out;
    }
  </style>

  <!-- Background Card -->
  <rect width="854" height="280" rx="16" fill="url(#bgGradient)"/>
  <rect width="854" height="280" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="180" cy="80" r="140" fill="url(#glowGrad)"/>
  <circle cx="700" cy="200" r="160" fill="url(#glowGrad)"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="852" height="278" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Top Decorative Tech Pill -->
  <g transform="translate(427, 48)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="-120" cy="0" r="4" fill="#10b981"/>
    <text x="0" y="4" text-anchor="middle" class="badge-text">SYS_ID: MODEL CARD // v2026.10</text>
  </g>

  <!-- Main Banner Title -->
  <text x="50%" y="138" text-anchor="middle" class="title" fill="url(#accentGrad)" filter="url(#glow)">anirudh.kumar</text>

  <!-- Subtitle Tagline -->
  <text x="50%" y="186" text-anchor="middle" class="desc">B.Tech CSE &amp;middot; AI &amp;amp; Machine Learning &amp;middot; Autonomous Systems</text>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(427, 232)">
    <rect x="-240" y="-15" width="480" height="30" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="-222" y="5" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#22d3ee" font-weight="700">&gt;</text>
    <text x="-205" y="5" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1">status: </text>
    <text x="-155" y="5" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#34d399">ready</text>
    <text x="-110" y="5" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#64748b">|</text>
    <text x="-95" y="5" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1">eval: </text>
    <text x="-55" y="5" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#a78bfa">understand &amp;rarr; build &amp;rarr; ship</text>
    <rect x="180" y="-7" width="8" height="15" fill="#22d3ee" class="cursor"/>
  </g>
</svg>
