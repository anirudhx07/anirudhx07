<svg width="854" height="230" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 230">
  <defs>
    <!-- Executive Slate Dark Background -->
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>

    <!-- Subtle Metallic Line Accent -->
    <linearGradient id="metallicAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    .name-title {
      font-family: 'Playfair Display', 'Merriweather', 'Georgia', 'Cambria', serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #f8fafc;
    }
    .role-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .institution {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.3px;
      fill: #94a3b8;
    }
    .meta-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      fill: #64748b;
    }
  </style>

  <!-- Container Box -->
  <rect x="0" y="0" width="854" height="230" rx="8" fill="url(#corpBg)"/>
  <rect x="1" y="1" width="852" height="228" rx="7" fill="none" stroke="url(#subtleBorder)" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <g transform="translate(56, 42)">
    <circle cx="4" cy="-3" r="3" fill="#38bdf8"/>
    <text x="16" y="0" class="meta-tag">ENGINEERING PROFILE &#183; AI &amp; MACHINE LEARNING</text>
  </g>

  <!-- Main Corporate Serif Name -->
  <text x="56" y="100" class="name-title">Anirudh Kumar</text>

  <!-- Divider Line -->
  <line x1="56" y1="120" x2="798" y2="120" stroke="url(#metallicAccent)" stroke-width="1"/>

  <!-- Sub-Headings with concise, calibrated text -->
  <text x="56" y="152" class="role-title">Computer Science Engineer &#183; AI &amp; Machine Learning</text>
  <text x="56" y="178" class="institution">Applied Machine Learning, Systems Architecture &amp; Production Software</text>
</svg>
